spring.application.name=kanban-backend
server.port=8080

# PostgreSQL — 로컬 기본값, Azure 등 배포 환경에서는 SPRING_DATASOURCE_* 환경변수로 주입
# (드라이버는 jdbc:postgresql:// URL에서 자동 감지)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kanban}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:kanban}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:kanban}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# 로그인 — 비밀번호가 비어 있으면 인증 자체를 끈다(로컬 개발·E2E는 그대로 동작).
# 운영은 docker-compose.prod.yml이 .env에서 주입하며, 값이 없으면 기동을 거부한다.
# 공개 저장소이므로 실제 비밀번호를 여기에 적지 말 것.
app.auth.username=${APP_AUTH_USERNAME:admin}
app.auth.password=${APP_AUTH_PASSWORD:}

# 운영에서 TLS는 앞단 caddy가 종단하고 백엔드에는 평문 http가 도착한다. 이 설정이
# 없으면 Spring이 요청 스킴을 http로 보고, 브라우저의 https Origin 헤더와 어긋나
# 같은 사이트의 POST를 교차 출처로 오판한다 — 전부 403 "Invalid CORS request"가
# 되어 로그인·저장만 실패한다(GET은 Origin이 없어 통과하므로 화면은 정상으로 보인다).
# X-Forwarded-* 헤더를 신뢰해도 되는 이유: 백엔드는 compose 내부 네트워크 전용이다.
# nginx가 caddy의 X-Forwarded-Proto를 그대로 전달해야 동작한다(front/nginx.conf와 세트).
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=12h

# 파일 업로드 저장 위치 (컨테이너에서는 APP_UPLOAD_DIR로 볼륨 경로 주입)
app.upload-dir=${APP_UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
