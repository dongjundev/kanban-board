server {
    listen 80;
    server_name _;

    # SPA 정적 파일 서빙 — 없는 경로는 index.html로 폴백(클라이언트 라우팅)
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 백엔드 API 프록시 — compose 서비스명 backend를 Docker 내부 DNS로 해석
    location /api/ {
        # nginx 기본값은 1MB라, 이 설정이 없으면 1MB를 넘는 파일 업로드가
        # 백엔드에 닿기도 전에 413으로 막힌다(백엔드는 50MB까지 허용).
        # application.properties의 max-request-size(55MB)와 맞춘다.
        client_max_body_size 55m;
        proxy_request_buffering off;   # 큰 업로드를 디스크에 통째로 받았다 넘기지 않는다
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
