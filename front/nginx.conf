server {
    listen 80;
    server_name _;

    # 앞단 caddy(TLS 종단)를 거쳐도 접근 로그에 실제 클라이언트 IP가 남게 한다 —
    # 없으면 로그에 caddy의 내부 IP만 찍혀 장애 분석(어느 PC의 요청인지)이 불가능해진다.
    # 이 컨테이너는 compose 내부 네트워크에서만 도달 가능하므로 사설 대역 신뢰는 안전하다.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # gzip — 공식 nginx 이미지 기본값은 꺼짐(#gzip on). 없으면 mermaid 코어 663KB,
    # elkjs 1.4MB 같은 큰 청크가 무압축 전송된다(켜면 각각 143KB/448KB, 약 70% 절감).
    # text/html은 gzip on만으로 항상 포함되므로 나머지 텍스트 타입만 나열한다.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA 정적 파일 서빙 — 없는 경로는 index.html로 폴백(클라이언트 라우팅)
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html은 매번 재검증(no-cache) — 캐시 지시자가 없으면 브라우저가 휴리스틱
    # 캐시로 이전 index.html(+옛 번들 참조)을 계속 써서, 재배포가 캐시 만료 시점까지
    # 안 보인다(실제 발생). SPA 폴백의 내부 리다이렉트도 이 블록을 거친다.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 번들은 파일명에 콘텐츠 해시가 박혀 불변 — 장기 캐시로 재방문 로딩을 없앤다.
    # 내용이 바뀌면 파일명이 바뀌고, no-cache인 index.html이 새 이름을 참조한다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 백엔드 API 프록시 — compose 서비스명 backend를 Docker 내부 DNS로 해석
    location /api/ {
        # nginx 기본값은 1MB라, 이 설정이 없으면 1MB를 넘는 파일 업로드가
        # 백엔드에 닿기도 전에 413으로 막힌다(백엔드는 50MB까지 허용).
        # application.properties의 max-request-size(55MB)와 맞춘다.
        client_max_body_size 55m;
        proxy_request_buffering off;   # 큰 업로드를 디스크에 통째로 받았다 넘기지 않는다
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # caddy(TLS 종단)가 판정한 원래 스킴(https)을 그대로 전달한다. $scheme으로 덮으면
        # nginx 자신이 받은 평문 http가 실려, Spring이 브라우저의 https Origin 헤더와
        # 스킴이 다른 "교차 출처"로 오판해 POST 전부가 403 Invalid CORS request가 된다
        # (backend의 server.forward-headers-strategy=framework와 세트).
        # caddy 없이 직접 접속하면 변수가 비어 헤더가 생략된다 — 실제 스킴으로 폴백.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
