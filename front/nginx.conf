server {
    listen 80;
    server_name _;

    # SPA 정적 파일 서빙 — 없는 경로는 index.html로 폴백(클라이언트 라우팅)
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html은 매번 재검증(no-cache) — 캐시 지시자가 없으면 브라우저가 휴리스틱
    # 캐시로 이전 index.html(+옛 번들 참조)을 계속 써서, 재배포가 캐시 만료 시점까지
    # 안 보인다(실제 발생). SPA 폴백의 내부 리다이렉트도 이 블록을 거친다.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 번들은 파일명에 콘텐츠 해시가 박혀 불변 — 장기 캐시로 재방문 로딩을 없앤다.
    # 내용이 바뀌면 파일명이 바뀌고, no-cache인 index.html이 새 이름을 참조한다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 백엔드 API 프록시 — compose 서비스명 backend를 Docker 내부 DNS로 해석
    location /api/ {
        # nginx 기본값은 1MB라, 이 설정이 없으면 1MB를 넘는 파일 업로드가
        # 백엔드에 닿기도 전에 413으로 막힌다(백엔드는 50MB까지 허용).
        # application.properties의 max-request-size(55MB)와 맞춘다.
        client_max_body_size 55m;
        proxy_request_buffering off;   # 큰 업로드를 디스크에 통째로 받았다 넘기지 않는다
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
