# 단일 VM 프로덕션 배포 — caddy(HTTPS 종단) + nginx(프론트) + spring-boot(백엔드) + postgres
#
# 사용법 (VM에서):
#   1) Azure Portal에서 공인 IP에 DNS 이름 레이블 추가 (공용 IP → 구성)
#   2) .env 파일에 POSTGRES_PASSWORD·APP_AUTH_PASSWORD·CADDY_DOMAIN 설정
#   3) docker compose -f docker-compose.prod.yml up -d --build
#   4) https://<CADDY_DOMAIN> 접속 (첫 기동 시 인증서 자동 발급 — 수십 초)
#
# 외부에 열리는 포트는 caddy의 80/443(+아래 postgres 5432 예외)뿐.
# frontend(80)·backend(8080)는 compose 내부 네트워크 전용이라 인터넷에서 접근 불가.
services:
  postgres:
    image: postgres:17
    # ⚠️ 외부(DBeaver 등) 직접 접속용 포트 공개. 반드시 Azure NSG에서 5432를
    #    "내 공인 IP만" 허용할 것 — 0.0.0.0/0으로 열면 DB가 상시 공격 대상이 됨.
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: kanban
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD를 설정하세요}
    volumes:
      - kanban-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanban -d kanban"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kanban
      SPRING_DATASOURCE_USERNAME: kanban
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD를 설정하세요}
      APP_UPLOAD_DIR: /app/uploads          # 업로드 파일 저장 위치 (볼륨)
      # 로그인 — 값이 없으면 기동을 거부한다(인증을 깜빡 잊고 공개 배포하는 사고 방지).
      # 실제 비밀번호는 .env에만 두고 절대 커밋하지 말 것(이 저장소는 공개).
      APP_AUTH_USERNAME: ${APP_AUTH_USERNAME:-admin}
      APP_AUTH_PASSWORD: ${APP_AUTH_PASSWORD:?.env에 APP_AUTH_PASSWORD를 설정하세요}
    volumes:
      - kanban-uploads:/app/uploads          # 업로드 파일 영속화
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    # 외부 노출은 caddy가 담당 — nginx는 내부 전용(캐시 헤더·gzip·/api 프록시는 그대로 유지)
    build: ./front
    depends_on:
      - backend
    restart: unless-stopped

  caddy:
    # HTTPS 종단. 요청 경로: 인터넷 :443 → caddy(TLS) → frontend(nginx) → backend.
    # 80 포트는 Let's Encrypt HTTP-01 챌린지와 옛 주소 리다이렉트에 쓰인다 —
    # NSG에서 80을 닫으면 인증서 갱신이 조용히 실패하니 열어둘 것.
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 — NSG가 UDP 443을 막아도 TCP로 자동 폴백
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:?.env에 CADDY_DOMAIN을 설정하세요 — .env.example 참고}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 발급받은 인증서 보존 — 없으면 컨테이너를 다시 만들 때마다 재발급을 시도해
      # Let's Encrypt 발급 한도(같은 이름 주당 5회)에 걸릴 수 있다.
      - kanban-caddy-data:/data
      - kanban-caddy-config:/config
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  kanban-pgdata:
  kanban-uploads:
  kanban-caddy-data:
  kanban-caddy-config:
